<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac AI Logo</title>
<style>
  :root {
    --bg: #050608; --ink: #eeede8; --lime: #c8ff3d; --violet: #8b6cff; --teal: #22c3b5;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "IBM Plex Mono", monospace;
  }

  /* the busy backdrop the glass frosts: drifting colour blobs */
  .aurora { position: fixed; inset: -20%; filter: blur(60px) saturate(140%); }
  .aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 16s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { width: 44vmax; height: 44vmax; left: 22%; top: 8%; background: var(--violet); }
  .aurora i:nth-child(2) { width: 30vmax; height: 30vmax; left: 52%; top: 4%; background: var(--lime); opacity: .55; animation-duration: 20s; animation-delay: -6s; }
  .aurora i:nth-child(3) { width: 30vmax; height: 30vmax; left: 54%; top: 46%; background: var(--teal); opacity: .5; animation-duration: 18s; animation-delay: -3s; }
  @keyframes drift { to { transform: translate(8vmax, -6vmax) scale(1.15); } }

  .stage { position: relative; display: grid; justify-items: center; gap: clamp(28px, 5vh, 48px); padding: 16px; }

  /* the glass tile: frost + translucency + lit rim + depth */
  .tile {
    --size: clamp(180px, 34vmin, 300px);
    position: relative; width: var(--size); aspect-ratio: 1; border-radius: 28%;
    background: linear-gradient(135deg, rgb(255 255 255 / .22), rgb(255 255 255 / .06) 50%, rgb(255 255 255 / .03));
    backdrop-filter: blur(22px) saturate(170%);
    -webkit-backdrop-filter: blur(22px) saturate(170%);
    box-shadow:
      0 30px 80px -20px rgb(0 0 0 / .6),
      0 0 0 1px rgb(255 255 255 / .06),
      inset 0 1px 0 rgb(255 255 255 / .45),
      inset 0 -1px 0 rgb(0 0 0 / .25);
    overflow: hidden; isolation: isolate;
    transition: transform .6s cubic-bezier(.16,1,.3,1), box-shadow .6s, background .6s;
    animation: enter 1.2s cubic-bezier(.16,1,.3,1) both;
  }
  /* lit corner rim: bright top-left, lime catch bottom-right */
  .tile::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: 2;
    background: linear-gradient(135deg, rgb(255 255 255 / .9), rgb(255 255 255 / .12) 42%, rgb(255 255 255 / .06) 80%, rgb(200 255 61 / .6));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  /* anti-banding grain */
  .tile::after {
    content: ""; position: absolute; inset: 0; opacity: .06; z-index: 1; pointer-events: none;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .tile svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
  /* specular sweep */
  .sweep {
    position: absolute; inset: -20% auto -20% -60%; width: 45%; z-index: 4; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / .28), transparent);
    transform: skewX(-18deg); animation: sweep 6s cubic-bezier(.65,0,.35,1) 1.2s infinite;
  }
  @keyframes sweep { 0% { left: -60%; } 35%, 100% { left: 130%; } }
  @keyframes enter { from { opacity: 0; transform: translateY(24px) scale(.92); backdrop-filter: blur(0); } }
  .tile:hover, :root[data-state="hover"] .tile {
    transform: translateY(-6px) rotate(-2deg);
    background: linear-gradient(135deg, rgb(255 255 255 / .28), rgb(255 255 255 / .08) 50%, rgb(255 255 255 / .04));
    box-shadow: 0 40px 100px -20px rgb(0 0 0 / .7), 0 0 60px -10px rgb(200 255 61 / .35), inset 0 1px 0 rgb(255 255 255 / .6), inset 0 -1px 0 rgb(0 0 0 / .25);
  }
  .spark { transform-origin: 61px 50px; animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 50% { transform: scale(1.22); } }

  .word { width: min(76vw, 460px); height: auto; animation: enter 1.2s .15s cubic-bezier(.16,1,.3,1) both; }
  .note { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgb(238 237 232 / .6); animation: enter 1.2s .3s both; }
  .note b { color: var(--lime); font-weight: 500; }

  @media (prefers-reduced-transparency: reduce) {
    .tile { background: #15122e; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .tile::after { display: none; }
  }
  :root.reduced-transparency .tile { background: #15122e; backdrop-filter: none; -webkit-backdrop-filter: none; }
  :root.reduced-transparency .tile::after { display: none; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .tile { background: rgb(26 22 56 / .9); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .sweep { display: none; }
  }
</style>
</head>

<script>
  // ?state=hover forces the hover look; ?t=N freezes every animation at N seconds; ?reduced=1 shows the solid fallback
  const q = new URLSearchParams(location.search);
  if (q.get("state")) document.documentElement.dataset.state = q.get("state");
  if (q.get("reduced")) document.documentElement.classList.add("reduced-transparency");
  const t = q.get("t");
  if (t !== null) document.getAnimations().forEach(a => { a.currentTime = parseFloat(t) * 1000; a.pause(); });
  window.__ready = true;
</script>
